spring.application.name=fitforge-backend

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fitforge_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:fitforge123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:FitForgeDevelopmentSecretKeyReplaceBeforeProduction2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.api-url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/interactions}
app.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}

logging.level.com.fitforge=INFO
logging.level.org.springframework.security=WARN
